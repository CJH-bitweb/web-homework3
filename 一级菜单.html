<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一级水平导航菜单</title>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px 0;
        }

        /* ===== 表格整体：作为导航条容器 ===== */
        table {
            border-collapse: collapse;
            margin: 0 auto;          /* 水平居中 */
            background: #1a5490;     /* 导航条底色 */
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        /* ===== 单元格：充当菜单项 ===== */
        td {
            padding: 0;              /* 去掉默认内边距，交给 a 控制 */
            border-right: 1px solid #2c6cb0;
        }

        td:last-child {
            border-right: none;      /* 最后一项不要右边框 */
        }

        /* ===== 链接：块级化，撑满单元格，可点击区域大 ===== */
        td a {
            display: block;
            padding: 14px 22px;      /* 盒模型：控制点击区域 */
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            white-space: nowrap;
            transition: background 0.25s;
        }

        /* ===== :hover 悬停变色 ===== */
        td a:hover {
            background: #f39c12;
            color: #fff;
        }
    </style>
</head>
<body>
    <table align="center">
        <tr>
            <td><a href="#">首页</a></td>
            <td><a href="#">教学院(部)</a></td>
            <td><a href="#">党群机构</a></td>
            <td><a href="#">行政教辅机构</a></td>
            <td><a href="#">教学科研</a></td>
            <td><a href="#">招生就业</a></td>
            <td><a href="#">国际交流</a></td>
            <td><a href="#">数字图书馆</a></td>
        </tr>
    </table>
</body>
</html>
